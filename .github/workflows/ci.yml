name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - if: runner.os == 'Windows'
        run: cargo +stable build --locked --release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Windows.ps1 -SkipBuild
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package
          path: dist/release/*
          if-no-files-found: error
      - if: runner.os == 'Linux'
        name: Build the static Linux release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl --toolchain stable
          cargo +stable build --locked --release --target x86_64-unknown-linux-musl
          bash scripts/package-linux.sh --skip-build
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package
          path: |
            dist/release/*-linux-x86_64.tar.gz
            dist/release/SHA256SUMS-linux.txt
          if-no-files-found: error

  compatibility:
    name: Codex ${{ matrix.codex }} (synthetic)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.152.1', '0.153.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Generate synthetic conversations and pin Codex
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_CODEX_VERSION: ${{ matrix.codex }}
        run: |
          $cases = ./scripts/New-SyntheticCorpus.ps1
          $binary = ./scripts/Get-TestCodex.ps1 -Version $env:TEST_CODEX_VERSION
          "CODEX_VAULT_DIFF_CASES=$cases" >> $env:GITHUB_ENV
          "CODEX_VAULT_CODEX_BIN=$binary" >> $env:GITHUB_ENV
          "CODEX_HOME=$env:RUNNER_TEMP/synthetic-codex-home" >> $env:GITHUB_ENV
          "CODEX_VAULT_DIFF_REPORT=$env:GITHUB_WORKSPACE/validation/synthetic/differential-results.jsonl" >> $env:GITHUB_ENV
      - name: Compare two resumptions and discover the Vault MCP tools
        run: cargo +stable test --locked --test differential -- --ignored --nocapture --test-threads=1
      - name: Keep anonymous synthetic case results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-${{ matrix.codex }}
          path: validation/synthetic/differential-results.jsonl
          if-no-files-found: warn

  clean-install:
    name: Clean installation (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-package
          - os: ubuntu-latest
            artifact: linux-package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: package
      - name: Install and exercise the packaged executable without building
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem package/*.zip)
          if ($archive.Count -ne 1) { throw 'Expected one release archive' }
          ./scripts/Test-Distribution.ps1 -Archive $archive[0].FullName
      - name: Install and verify static ELF, recovery and bundled SQLite
        if: runner.os == 'Linux'
        run: python3 scripts/test-linux-distribution.py package/*-linux-x86_64.tar.gz

  publish:
    name: Publish Windows and Linux prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, compatibility, clean-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-package
          path: package/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-package
          path: package/linux
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          windows="codex-vault-$version-windows-x86_64.zip"
          linux="codex-vault-$version-linux-x86_64.tar.gz"
          test -f "package/windows/$windows"
          test -f "package/linux/$linux"
          {
            (cd package/windows && sha256sum --binary "$windows")
            (cd package/linux && sha256sum --binary "$linux")
          } > package/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "package/windows/$windows" "package/linux/$linux" package/SHA256SUMS.txt --verify-tag --prerelease --title "Codex Vault $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
