name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - if: runner.os == 'Windows'
        run: cargo +stable build --locked --release
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Windows.ps1 -SkipBuild
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-package
          path: dist/release/*
          if-no-files-found: error

  compatibility:
    name: Codex ${{ matrix.codex }} (synthetic)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        codex: ['0.152.1', '0.153.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Generate synthetic conversations and pin Codex
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_CODEX_VERSION: ${{ matrix.codex }}
        run: |
          $cases = ./scripts/New-SyntheticCorpus.ps1
          $binary = ./scripts/Get-TestCodex.ps1 -Version $env:TEST_CODEX_VERSION
          "CODEX_VAULT_DIFF_CASES=$cases" >> $env:GITHUB_ENV
          "CODEX_VAULT_CODEX_BIN=$binary" >> $env:GITHUB_ENV
          "CODEX_HOME=$env:RUNNER_TEMP/synthetic-codex-home" >> $env:GITHUB_ENV
      - name: Compare two resumptions and discover the Vault MCP tools
        run: cargo +stable test --locked --test differential -- --ignored --nocapture --test-threads=1

  clean-install:
    name: Clean Windows installation
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-package
          path: package
      - name: Install and exercise the packaged executable without building
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem package/*.zip)
          if ($archive.Count -ne 1) { throw 'Expected one release archive' }
          ./scripts/Test-Distribution.ps1 -Archive $archive[0].FullName

  publish:
    name: Publish Windows prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, compatibility, clean-install]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-package
          path: package
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archives = @(Get-ChildItem package/*.zip)
          $expectedName = "codex-vault-$($env:GITHUB_REF_NAME.Substring(1))-windows-x86_64.zip"
          if ($archives.Count -ne 1 -or $archives[0].Name -ne $expectedName) { throw 'Release tag must match the packaged Cargo version' }
          gh release create $env:GITHUB_REF_NAME $archives[0].FullName package/SHA256SUMS.txt --verify-tag --prerelease --title "Codex Vault $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
